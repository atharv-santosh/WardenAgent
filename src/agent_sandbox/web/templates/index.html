<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Injection Playground</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <h1>Injection Playground</h1>
      <nav class="tabs" id="tabs">
        <button class="tab active" data-tab="attack">Attack</button>
        <button class="tab" data-tab="corpus">Corpus</button>
      </nav>
    </header>

    <div id="mode-banner" class="banner" hidden></div>

    <main id="view-attack" class="view">
      <section class="compose">
        <div class="field">
          <label for="preset-select">Preset</label>
          <select id="preset-select"><option value="">blank</option></select>
        </div>

        <div class="field">
          <label for="trusted-task">Task</label>
          <textarea id="trusted-task" rows="2"></textarea>
        </div>

        <div class="field">
          <label for="untrusted-text">Untrusted content</label>
          <textarea id="untrusted-text" rows="6"></textarea>
        </div>

        <div class="row">
          <div class="field">
            <label for="carrier-tool">Carrier</label>
            <select id="carrier-tool">
              <option value="fetch_url">fetch_url</option>
              <option value="read_email">read_email</option>
              <option value="read_file">read_file</option>
              <option value="">none</option>
            </select>
          </div>
          <div class="field">
            <label for="model-select">Model</label>
            <select id="model-select"></select>
          </div>
          <div class="field">
            <label for="declassify-select">Declassify</label>
            <select id="declassify-select">
              <option value="">none</option>
              <option value="approval">approval</option>
              <option value="quarantine">quarantine</option>
            </select>
          </div>
        </div>

        <div class="row row-run">
          <div class="toggle-group" id="model-toggle" role="group" aria-label="model mode">
            <button type="button" class="toggle-btn active" data-mode="sim">Simulator</button>
            <button type="button" class="toggle-btn" data-mode="real">Gemini</button>
          </div>
          <button id="run-btn" class="btn-primary">Run</button>
          <span class="spacer"></span>
          <span class="fineprint">Tools are simulated. Nothing leaves this machine.</span>
        </div>
      </section>

      <section class="run-status" id="run-status" hidden>
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">Running</span>
        <span class="spacer"></span>
        <span id="cost-badge" class="badge" hidden></span>
      </section>

      <section class="results-grid">
        <article class="result-col" id="naive-col">
          <h2>Undefended</h2>
          <div class="result-body" id="naive-body">
            <p class="empty-hint">No run yet.</p>
          </div>
        </article>
        <article class="result-col" id="sandboxed-col">
          <h2>Sandboxed</h2>
          <div class="result-body" id="sandboxed-body">
            <p class="empty-hint">No run yet.</p>
          </div>
        </article>
      </section>
    </main>

    <main id="view-corpus" class="view" hidden>
      <section class="compose">
        <div class="row">
          <div class="field">
            <label for="corpus-category">Category</label>
            <select id="corpus-category"><option value="">all</option></select>
          </div>
          <div class="field">
            <label for="corpus-model">Model</label>
            <select id="corpus-model"></select>
          </div>
          <div class="field">
            <label for="corpus-declassify">Declassify</label>
            <select id="corpus-declassify">
              <option value="">none</option>
              <option value="approval">approval</option>
              <option value="quarantine">quarantine</option>
            </select>
          </div>
        </div>
        <div class="row row-run">
          <div class="toggle-group" id="corpus-model-toggle" role="group" aria-label="model mode">
            <button type="button" class="toggle-btn active" data-mode="sim">Simulator</button>
            <button type="button" class="toggle-btn" data-mode="real">Gemini</button>
          </div>
          <label class="check-inline"><input type="checkbox" id="corpus-include-benign" checked> benign cases</label>
          <button id="corpus-estimate-btn" class="btn-secondary">Estimate</button>
          <button id="corpus-run-btn" class="btn-primary">Run</button>
        </div>
        <div id="corpus-estimate" class="estimate-box" hidden></div>
      </section>

      <section id="corpus-progress" hidden>
        <div class="progress-row">
          <div class="progress-track"><div class="progress-fill" id="corpus-progress-fill"></div></div>
          <span id="corpus-progress-text">0 / 0</span>
        </div>
        <div id="corpus-log" class="corpus-log"></div>
      </section>

      <section id="corpus-results" hidden>
        <div class="table-wrap">
          <table id="corpus-table">
            <thead><tr><th>Category</th><th>Cases</th><th>Naive</th><th>Sandboxed</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
        <p id="corpus-summary" class="summary-line"></p>
        <p id="corpus-cost" class="summary-line"></p>
      </section>
    </main>
  </div>

  <div id="approval-overlay" class="overlay" hidden>
    <div class="approval-modal" role="dialog" aria-labelledby="approval-title">
      <h2 id="approval-title">Approve tool call</h2>
      <dl class="approval-facts">
        <dt>Tool</dt><dd id="approval-tool" class="mono"></dd>
        <dt>Rule</dt><dd id="approval-rule" class="mono"></dd>
        <dt>Arguments</dt><dd id="approval-args" class="mono"></dd>
      </dl>
      <div class="provenance-block">
        <h3>Provenance</h3>
        <div id="approval-provenance"></div>
      </div>
      <p class="fineprint">Untrusted text is withheld by design.</p>
      <div class="field">
        <label for="approval-reason">Reason</label>
        <input id="approval-reason" type="text" />
      </div>
      <div class="approval-actions">
        <button id="approval-deny" class="btn-deny">Deny</button>
        <button id="approval-approve" class="btn-approve">Approve</button>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
