[project]
name = "agent-sandbox"
version = "0.1.0"
description = "Capability-scoped agent sandbox with taint-tracked prompt-injection defense"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.21",
    "click>=8.1",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]
anthropic = [
    "anthropic>=0.34",
]
gemini = [
    "google-genai>=1.30",
]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
]

[project.scripts]
sbx = "agent_sandbox.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_sandbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
