name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Create venv and install
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install -e ".[dev,web]"

      - name: Run test suite with no credentials configured
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ""
          GOOGLE_CLOUD_PROJECT: ""
        run: |
          source .venv/bin/activate
          pytest -q

      - name: Validate default policy
        run: |
          source .venv/bin/activate
          sbx policy check policies/default.yaml

      - name: Run red-team corpus end-to-end (false-positive matrix)
        run: |
          source .venv/bin/activate
          sbx redteam --fp-matrix --json-out redteam-results.json

      - name: Run the adaptive attack set
        run: |
          source .venv/bin/activate
          sbx adaptive --json-out adaptive-results.json

      - name: Generate HTML report
        run: |
          source .venv/bin/activate
          sbx report --out redteam-report.html

      - name: Upload red-team artifacts
        uses: actions/upload-artifact@v4
        with:
          name: redteam-results-py${{ matrix.python-version }}
          path: |
            redteam-results.json
            adaptive-results.json
            redteam-report.html
